name: Refresh sportsbook odds
on:
  workflow_run:
    workflows: ['Public-data model and current-season tests']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    paths: ['scripts/odds_quota.py','scripts/test_odds_quota.py','scripts/refresh_odds.py', 'scripts/refresh_bdl_props.py', 'scripts/test_bdl_props.py', '.github/workflows/odds.yml']
  schedule:
    - cron: '11 */6 * * *'
permissions:
  contents: write
concurrency:
  group: public-model-refresh
  cancel-in-progress: false
jobs:
  odds:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collection and quota handling
        run: python -m unittest scripts.test_odds_quota scripts.test_odds scripts.test_bdl_props -v
      - name: Collect credential-free sportsbook snapshots
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_RESET_AT: ${{ vars.ODDS_API_RESET_AT }}
          ODDS_REFRESH_CREDIT_BUDGET: ${{ vars.ODDS_REFRESH_CREDIT_BUDGET }}
        run: python -m scripts.refresh_odds
      - name: Supplement exact player markets from BALLDONTLIE
        env:
          BALLDLIE_API_KEY: ${{ secrets.BALLDLIE_API_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python -m scripts.refresh_bdl_props
      - name: Publish prices and bounded movement history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/odds.json data/odds-history.json
          if test -f data/odds-quota-props.json; then git add data/odds-quota-props.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh sportsbook odds snapshots [skip ci]'
            bash scripts/push_refresh.sh
          fi
