name: NFL data providers and weather
on:
  workflow_dispatch:
  push:
    paths: ['intelligence/**', '.github/workflows/providers.yml']
  schedule:
    - cron: '29 */6 * * *'
permissions:
  contents: write
concurrency:
  group: supplemental-provider-refresh
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NFLREADPY_CACHE: filesystem
      NFLREADPY_CACHE_DIR: work/nflreadpy-cache
      NFLREADPY_TIMEOUT: '45'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r intelligence/requirements.txt
      - uses: actions/cache@v4
        with:
          path: work/nflreadpy-cache
          key: nflreadpy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nflreadpy-${{ runner.os }}-
      - name: Test provider contracts and probability policy
        run: python -m unittest discover -s intelligence -p 'test_*.py' -v
      - name: Ingest documented public and authenticated providers
        env:
          BALLDLIE_API_KEY: ${{ secrets.BALLDLIE_API_KEY || secrets.BALLDONTLIE_API_KEY }}
          XWEATHER_API_KEY: ${{ secrets.XWEATHER_API_KEY }}
          XWEATHER_CLIENT_ID: ${{ secrets.XWEATHER_CLIENT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m intelligence.ingest
          python -m intelligence.database
      - name: Publish credential-free source snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/providers.json data/balldontlie.json data/weather.json data/advanced-stats.json data/upcoming-games.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh supplemental NFL data and kickoff weather [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfl-data-lake-${{ github.run_id }}
          path: work/lake/
          retention-days: 7
