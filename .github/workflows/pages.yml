name: Publish website to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'index.html'
      - 'site-preview.html'
  workflow_run:
    workflows: ['Build professional NFL dashboard']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: website-pages-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stage only the published website
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          root=Path('.');target=Path('_pages')
          target.mkdir(exist_ok=True)
          source=root/'platform'
          assert (source/'index.html').is_file(), 'Exported dashboard is missing'
          shutil.copytree(source,target/'platform',ignore=shutil.ignore_patterns('frontend'),dirs_exist_ok=True)
          for name in ['index.html','site-preview.html']:
              shutil.copy2(root/name,target/name)
          (target/'.nojekyll').touch()
          files=[p for p in target.rglob('*') if p.is_file()]
          assert not any(p.is_symlink() for p in target.rglob('*')), 'Symlinks are not supported'
          size=sum(p.stat().st_size for p in files)
          assert size<500_000_000, 'Website package unexpectedly large'
          print(f'Website package: {len(files)} files, {size:,} bytes')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
          name: website-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Use the dedicated Pages workflow and clear the superseded deployment
        uses: actions/github-script@v7
        with:
          script: |
            const repository = {owner: context.repo.owner, repo: context.repo.repo};
            try {
              const {data: settings} = await github.request('GET /repos/{owner}/{repo}/pages', repository);
              if (settings.build_type === 'legacy') {
                await github.request('PUT /repos/{owner}/{repo}/pages', {...repository, build_type: 'workflow'});
                core.info('Pages now uses the dedicated website workflow, avoiding duplicate branch deployments.');
              }
            } catch (error) {
              core.warning('Pages build-source check returned HTTP ' + error.status + '; continuing with deployment recovery.');
            }
            // GitHub identified this older deployment as the blocker in the failed deployment response.
            const deploymentId = '57b95d9c1704c96ba171daf6db9edc2ae8cee59c';
            try {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', {...repository, deploymentId});
              core.info('Cancelled the known superseded deployment blocking publication.');
              await new Promise(resolve => setTimeout(resolve, 5000));
            } catch (error) {
              if ([404, 409, 422].includes(error.status) || error.status === 400 && /finished/i.test(error.message)) core.info('Superseded deployment is no longer cancellable; continuing.');
              else throw error;
            }
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          artifact_name: website-${{ github.run_id }}-${{ github.run_attempt }}
