name: Publish website to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'index.html'
      - 'site-preview.html'
  workflow_run:
    workflows: ['Build professional NFL dashboard']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: website-pages-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stage only the published website
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          root=Path('.');target=Path('_pages')
          target.mkdir(exist_ok=True)
          source=root/'platform'
          assert (source/'index.html').is_file(), 'Exported dashboard is missing'
          shutil.copytree(source,target/'platform',ignore=shutil.ignore_patterns('frontend'),dirs_exist_ok=True)
          for name in ['index.html','site-preview.html']:
              shutil.copy2(root/name,target/name)
          (target/'.nojekyll').touch()
          files=[p for p in target.rglob('*') if p.is_file()]
          assert not any(p.is_symlink() for p in target.rglob('*')), 'Symlinks are not supported'
          size=sum(p.stat().st_size for p in files)
          assert size<500_000_000, 'Website package unexpectedly large'
          print(f'Website package: {len(files)} files, {size:,} bytes')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
          name: website-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Recover the previously stuck Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = '64076a545cb909272be840e6f579b00337e6c90a';
            const parameters = {owner: context.repo.owner, repo: context.repo.repo, deploymentId};
            try {
              const {data} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', parameters);
              core.info('Earlier Pages deployment: ' + data.status);
              if (['deployment_queued', 'deployment_in_progress', 'queued', 'in_progress'].includes(data.status)) {
                await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', parameters);
                core.info('Cancelled the superseded deployment blocking publication.');
                for (let attempt = 0; attempt < 12; attempt++) {
                  const {data: status} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', parameters);
                  if (!['deployment_queued', 'deployment_in_progress', 'queued', 'in_progress'].includes(status.status)) break;
                  await new Promise(resolve => setTimeout(resolve, 5000));
                }
              }
            } catch (error) {
              if (error.status === 404) core.info('Earlier deployment has expired; no recovery needed.');
              else throw error;
            }
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          artifact_name: website-${{ github.run_id }}-${{ github.run_attempt }}
