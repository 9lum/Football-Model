name: Refresh reported game weather
on:
  workflow_dispatch:
  push:
    paths: ['scripts/refresh_game_weather.py','tests/test_game_weather.py','.github/workflows/game-weather.yml']
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: reported-game-weather
  cancel-in-progress: false
jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_game_weather -v
      - run: python -m scripts.refresh_game_weather
      - name: Publish source-labeled stadium conditions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/game-weather.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh reported stadium conditions [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
