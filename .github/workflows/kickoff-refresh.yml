name: Final pregame stats and touchdown markets
on:
  workflow_dispatch:
  push:
    paths: ['scripts/kickoff_refresh.py','scripts/odds_quota.py','scripts/test_kickoff_refresh.py','.github/workflows/kickoff-refresh.yml']
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: final-pregame-refresh
  cancel-in-progress: false
jobs:
  kickoff:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check kickoff windows without paid API requests
        id: window
        run: python -m scripts.kickoff_refresh --plan
      - name: Validate deadline and quota policy
        run: python -m unittest scripts.test_kickoff_refresh -v
      - name: Publish initial kickoff targets
        if: steps.window.outputs.due != 'true' && github.event_name != 'schedule'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kickoff-refresh.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish planned final pregame refresh deadlines [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - if: steps.window.outputs.due == 'true'
        run: pip install -r requirements.txt
      - uses: actions/cache@v4
        if: steps.window.outputs.due == 'true'
        with:
          path: work/attd-pbp
          key: pregame-pbp-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pregame-pbp-${{ runner.os }}-
            attd-pbp-${{ runner.os }}-
      - name: Prepare early and publish final sources before kickoff
        if: steps.window.outputs.due == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PREGAME_PUBLISH: '1'
        run: python -m scripts.kickoff_refresh --run
