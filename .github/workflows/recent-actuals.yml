name: Refresh verified recent offensive box scores
on:
  workflow_dispatch:
  push:
    paths: ['scripts/refresh_recent_actuals.py','scripts/performance_boxscore.py','.github/workflows/recent-actuals.yml']
  schedule:
    - cron: '10,40 * * * *'
permissions:
  contents: write
concurrency:
  group: recent-offensive-actuals
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest scripts.test_recent_actuals -v
      - run: python -m scripts.refresh_recent_actuals
      - name: Publish verified final actuals without changing forecasts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/recent-player-actuals.json
          for file in data/player-research/espn-*.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified final offensive box scores and coverage audit [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
