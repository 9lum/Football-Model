name: Evaluate NFL game score and market projections
on:
  workflow_dispatch:
  push:
    paths: ['edge/game_model.py', 'tests/test_game_model.py', '.github/workflows/game-model.yml']
  schedule:
    - cron: '49 */6 * * *'
permissions:
  contents: write
concurrency:
  group: game-score-projections
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_game_model.py' -v
      - name: Fit joint score model and evaluate untouched game weeks
        run: python -m edge.game_model
      - name: Publish game forecasts and separate validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/game-projections.json data/game-projection-history.json
          git commit -m 'Refresh research game-score and market projections [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
