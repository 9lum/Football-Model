name: Public injuries, starters and fair-odds scenarios
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Public-data model and current-season tests']
    types: [completed]
  push:
    paths: ['edge/chemistry.py', 'tests/test_chemistry.py', 'edge/availability.py', 'edge/replacement_forecasts.py', 'web/lineup-replacements.mjs', 'edge/workload.py', 'edge/return_reports.py', 'web/workload.mjs', 'tests/test_workload.py', 'web/availability.mjs', '.github/workflows/availability.yml']
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: availability-refresh
  cancel-in-progress: false
jobs:
  availability:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: work/health-cache
          key: health-reference-${{ runner.os }}-${{ hashFiles('edge/availability.py') }}-${{ github.run_id }}
          restore-keys: |
            health-reference-${{ runner.os }}-${{ hashFiles('edge/availability.py') }}-
            health-reference-${{ runner.os }}-
      - name: Check injury resolution and projection scenarios
        run: |
          python -m unittest discover -s tests -p 'test_chemistry.py' -v
          python -m unittest discover -s tests -p 'test_availability.py' -v
          python -m unittest discover -s tests -p 'test_replacement_forecasts.py' -v
          python -m unittest discover -s tests -p 'test_workload.py' -v
          node --test web/availability.test.mjs web/workload.test.mjs
      - name: Refresh public injury reports and depth charts
        run: python -m edge.availability --data data
      - name: Publish current availability and change log
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/availability.json data/availability-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public injury and starter context [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: availability-${{ github.run_id }}
          path: |
            data/availability.json
            data/availability-history.json
          retention-days: 90
