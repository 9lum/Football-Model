name: Refresh stadium weather outlooks
on:
  workflow_run:
    workflows: ['Public-data model and current-season tests']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    paths: ['scripts/refresh_stadium_weather.py','scripts/refresh_stadium_media.py','.github/workflows/stadium-weather.yml','tests/test_stadium_weather.py']
  schedule:
    - cron: '12,42 * * * *'
permissions:
  contents: write
concurrency:
  group: stadium-weather-outlooks
  cancel-in-progress: false
jobs:
  weather:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      XWEATHER_CLIENT_ID: ${{ secrets.XWEATHER_CLIENT_ID }}
      XWEATHER_API_KEY: ${{ secrets.XWEATHER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test stadium resolution and game-window sampling
        run: python -m unittest tests.test_stadium_weather scripts.test_weather_fallback -v
      - name: Collect public stadium forecasts
        run: |
          python -m scripts.refresh_stadium_weather
      - name: Publish credential-free weather snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stadium-weather.json data/stadium-venues.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh stadium weather and venue imagery [skip ci]'
            bash scripts/push_refresh.sh
          fi

      - name: Refresh venue images after weather is published
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python -m scripts.refresh_stadium_media
          git add data/stadium-media.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh stadium imagery after forecast publication [skip ci]'
            bash scripts/push_refresh.sh
          fi
