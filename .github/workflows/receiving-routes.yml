name: Refresh player field profiles
on:
  workflow_dispatch:
  push:
    paths: ['edge/receiving_routes.py', 'edge/passing_profiles.py', 'scripts/refresh_receiving_routes.py', '.github/workflows/receiving-routes.yml']
  schedule:
    - cron: '34 */6 * * *'
permissions:
  contents: write
concurrency:
  group: receiving-route-profiles
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_receiving_routes.py' -v
      - run: python -m unittest discover -s tests -p 'test_passing_profiles.py' -v
      - run: python -m scripts.refresh_receiving_routes
      - name: Publish public receiving profiles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/receiving-route-profiles.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh measured receiving target-depth field profiles [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
