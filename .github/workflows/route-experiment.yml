name: Refresh experimental route trees
on:
  workflow_dispatch:
  push:
    paths: ['scripts/refresh_route_experiment.py', 'scripts/test_route_experiment.py', '.github/workflows/route-experiment.yml']
  schedule:
    - cron: '18 14 * * 2'
permissions:
  contents: write
concurrency:
  group: route-experiment-charting
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest scripts.test_route_experiment -v
      - run: python -m scripts.refresh_route_experiment
      - name: Publish source-labeled experimental charting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/route-experiment.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh experimental targeted-route charting [skip ci]'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
