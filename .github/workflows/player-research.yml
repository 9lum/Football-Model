name: Refresh player season and rolling research statistics
on:
  workflow_dispatch:
  push:
    paths: ['scripts/refresh_player_research.py','.github/workflows/player-research.yml']
  schedule:
    - cron: '56 */6 * * *'
permissions:
  contents: write
concurrency:
  group: player-research-statistics
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate small player-specific historical files
        run: python -m scripts.refresh_player_research
      - name: Publish actual season and game statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/player-research data/player-research-index.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh historical player research statistics [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
