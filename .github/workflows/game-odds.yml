name: Refresh NFL moneylines spreads and totals
on:
  workflow_dispatch:
  push:
    paths: ['scripts/refresh_game_odds.py', 'scripts/test_game_odds.py', '.github/workflows/game-odds.yml']
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: game-market-odds
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_game_odds.py' -v
      - name: Retrieve current game markets when refresh is due
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GAME_ODDS_REFRESH_MINUTES: ${{ vars.GAME_ODDS_REFRESH_MINUTES }}
          FORCE_GAME_ODDS_REFRESH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python -m scripts.refresh_game_odds
      - name: Publish credential-free prices and movement history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/game-odds.json
          if test -f data/game-odds-history.json; then git add data/game-odds-history.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh NFL moneylines spreads and totals [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
